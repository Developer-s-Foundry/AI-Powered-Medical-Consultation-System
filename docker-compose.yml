version: "3.9"

services:
  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: healthbridge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthbridge-network

  redis:
    image: redis:7-alpine
    container_name: healthbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthbridge-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: healthbridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: healthbridge-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3004
      PROFILE_SERVICE_URL: http://profile-service:3007
      DRUG_SERVICE_URL: http://drug-service:2012
      PAYMENT_SERVICE_URL: http://payment-service:3002
      AI_SERVICE_URL: http://ai-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:2002
    depends_on:
      - auth-service
      - profile-service
      - drug-service
      - payment-service
      - ai-service
      - notification-service
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: healthbridge-auth-service
    environment:
      PORT: 3004
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: auth-events
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # PROFILE SERVICE
  # ─────────────────────────────────────────
  profile-service:
    build:
      context: ./users-profile-service
      dockerfile: Dockerfile
    container_name: healthbridge-profile-service
    environment:
      PORT: 3007
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/profiles_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: health-bridge-events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # DRUG SERVICE
  # ─────────────────────────────────────────
  drug-service:
    build:
      context: ./drug-service
      dockerfile: Dockerfile
    container_name: healthbridge-drug-service
    environment:
      PORT: 2012
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/drugs_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: health-bridge-events
      CLIENT_URL: http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # PAYMENT SERVICE
  # ─────────────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: healthbridge-payment-service
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: payments_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_BASE_URL: https://api.paystack.co
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # AI SERVICE
  # ─────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: healthbridge-ai-service
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ai_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: health-bridge-events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_BASE_URL: https://api.paystack.co
      FRONTEND_URL: http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # NOTIFICATION SERVICE
  # ─────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: healthbridge-notification-service
    environment:
      PORT: 2002
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: notifications_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthbridge-network

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthbridge-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - healthbridge-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  healthbridge-network:
    driver: bridge
